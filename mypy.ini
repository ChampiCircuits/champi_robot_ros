[mypy]
# mypy Configuration

# General options
check_untyped_defs = True
ignore_missing_imports = False

# Ignore specific errors (ROS attributes and untyped imports)
disable_error_code = attr-defined, import-untyped

# Exclude launch files
exclude = (launch/.*\.py|setup\.py)

[mypy-champi_interfaces.*]
ignore_errors = True

[mypy-std_msgs.*]
ignore_errors = True

[mypy-nav_msgs.*]
ignore_errors = True

[mypy-geometry_msgs.*]
ignore_errors = True

[mypy-rclpy.*]
ignore_errors = True

[mypy-launch.*]
ignore_errors = True

[mypy-ament_index_python.*]
ignore_errors = True

[mypy-scipy.*]
ignore_errors = True

[mypy-yaml]
ignore_errors = True

[mypy-champi_libraries_py.*]
ignore_missing_imports = True

[mypy-champi_interfaces.action]
ignore_missing_imports = True

[mypy-champi_interfaces.msg]
ignore_missing_imports = True

[mypy-champi_interfaces.srv]
ignore_missing_imports = True
