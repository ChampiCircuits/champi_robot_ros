[mypy]
# Configuration mypy pour champi_brain

# Options générales
check_untyped_defs = True
ignore_missing_imports = True

# Ignorer les erreurs spécifiques (imports sans stubs + attributs ROS)
disable_error_code = import-untyped, attr-defined

# Exclure les fichiers launch
exclude = (launch/.*\.py|setup\.py)

# Configuration par module pour ROS interfaces
[mypy-champi_interfaces.*]
ignore_errors = True

[mypy-std_msgs.*]
ignore_errors = True

[mypy-nav_msgs.*]
ignore_errors = True

[mypy-geometry_msgs.*]
ignore_errors = True

[mypy-rclpy.*]
ignore_errors = True

[mypy-launch.*]
ignore_errors = True

[mypy-yaml]
ignore_errors = True
