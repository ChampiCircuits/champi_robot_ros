#VRML_SIM R2025a utf8

PROTO Watchtower [
  field SFVec3f    translation       0 0 0
  field SFRotation rotation          0 0 1 0
  field SFString   name              "watchtower"
  field SFString   customData        ""
  field SFBool     supervisor        FALSE
  field SFBool     synchronization   TRUE
  field SFVec3f    cameraMountPos    0 0 2.0
  field SFInt32    cameraWidth       640
  field SFInt32    cameraResHeight   480
  field SFFloat    cameraFov         0.7854
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller "<extern>"
    customData IS customData
    supervisor IS supervisor
    synchronization IS synchronization
    children [
      # Tower base
      Shape {
        appearance PBRAppearance {
          baseColor 0.7 0.7 0.7
          metalness 0
          roughness 0.3
        }
        geometry Cylinder {
          height 0.2
          radius 0.3
        }
      }
      # Tower pole
      Transform {
        translation 0 0 1.0
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.5 0.5 0.5
              metalness 0
              roughness 0.3
            }
            geometry Cylinder {
              height 2.0
              radius 0.05
            }
          }
        ]
      }
      # Camera mount
      Transform {
        translation IS cameraMountPos
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.2 0.2 0.2
              metalness 0
              roughness 0.4
            }
            geometry Box {
              size 0.2 0.2 0.1
            }
          }
          # Camera
          Camera {
            translation 0 0.1 0
            name "watchtower_camera"
            fieldOfView IS cameraFov
            width IS cameraWidth
            height IS cameraResHeight
            near 0.1
            far 100.0
          }
        ]
      }
    ]
    boundingObject Group {
      children [
        # Base collision
        Cylinder {
          height 0.2
          radius 0.3
        }
        # Pole collision
        Transform {
          translation 0 0 1.0
          children [
            Cylinder {
              height 2.0
              radius 0.05
            }
          ]
        }
      ]
    }
  }
}