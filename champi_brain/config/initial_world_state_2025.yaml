################################################################################
# The initial world_state.yaml with real measurements from the rules
# the elements positions are given at their center
# the zones positions are given at their bottom-left corner
# the origin of the coordinate system is at the bottom-left corner of the table
# all measurements are in meters
################################################################################


#################################################################################
# Definition of the elements on the table
#################################################################################
elements:

  - id: banner
    type: banner
    x: 1.18
    y: 0.46
    theta_deg: 90.0

  - id: elements_1
    type: elements
    x: 1.1
    y: 0.95
    theta_deg: 90.0

  - id: elements_2
    type: elements
    x: 0.775
    y: 0.25
    theta_deg: 270.0

  - id: elements_3
    type: elements
    x: 0.075
    y: 0.4
    theta_deg: 180.0

#################################################################################
# Definition of the zones on the table
#################################################################################
zones:

  - id: depart_jaune
    type: secure_zone
    x: 0
    y: 1.55
    width: 0.6
    height: 0.45
    color: yellow